services:
  # Chatum Backend Web Service (Node.js + Socket.io + SQLite)
  - type: web
    name: chatum-backend
    env: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: "*"
    # Optional persistent disk for SQLite (uncomment on paid Render plans if desired)
    # disk:
    #   name: chatum-data
    #   mountPath: /var/data
    #   sizeGB: 1
    # envVars:
    #   - key: DATABASE_PATH
    #     value: /var/data/chat.db

  # Chatum Frontend (Static Site on Render)
  - type: web
    name: chatum-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_BACKEND_URL
        fromService:
          type: web
          name: chatum-backend
          property: host
